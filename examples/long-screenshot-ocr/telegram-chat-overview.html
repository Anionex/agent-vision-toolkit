<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram long-screenshot OCR overview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 390px;
      height: 2600px;
      margin: 0;
      overflow: hidden;
      background: #dcecf4;
      color: #17344a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: 390px;
      height: 2600px;
      padding: 22px;
      background:
        radial-gradient(circle at 92% 3%, rgba(34, 158, 217, 0.22), transparent 310px),
        linear-gradient(180deg, #eef7fb 0%, #dcecf4 52%, #d4e7f0 100%);
    }

    .hero {
      height: 190px;
      padding: 18px 19px;
      overflow: hidden;
      border: 1px solid rgba(22, 65, 92, 0.1);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 11px 30px rgba(24, 76, 105, 0.13);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      color: #248fc5;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.25px;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #229ed9;
      box-shadow: 0 0 0 5px rgba(34, 158, 217, 0.12);
    }

    h1 {
      margin: 0;
      color: #102d42;
      font-size: 31px;
      font-weight: 820;
      letter-spacing: -1.25px;
      line-height: 1.02;
    }

    h1 span {
      color: #229ed9;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 15px;
    }

    .stat {
      padding: 8px 3px 7px;
      border: 1px solid #d9e9f1;
      border-radius: 9px;
      background: #f5fafc;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: #18384e;
      font-size: 14px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: #678293;
      font-size: 7.5px;
      font-weight: 750;
      letter-spacing: 0.35px;
      text-transform: uppercase;
    }

    .story {
      display: grid;
      grid-template-columns: 67px 265px;
      gap: 14px;
      height: 2240px;
      margin-top: 18px;
    }

    .full-rail {
      position: relative;
      height: 2240px;
      overflow: hidden;
      border: 1px solid rgba(20, 71, 100, 0.14);
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 10px 26px rgba(24, 76, 105, 0.12);
    }

    .rail-label {
      height: 28px;
      padding-top: 9px;
      color: #318ebc;
      font-size: 7px;
      font-weight: 850;
      letter-spacing: 0.8px;
      text-align: center;
    }

    .rail-image {
      display: block;
      width: 55px;
      height: auto;
      margin: 0 auto;
      border: 1px solid #c8dce7;
      border-radius: 4px;
    }

    .checkpoints {
      display: flex;
      height: 2240px;
      flex-direction: column;
      gap: 35px;
    }

    .checkpoint {
      height: 420px;
      overflow: hidden;
      border: 1px solid rgba(20, 71, 100, 0.14);
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 10px 26px rgba(24, 76, 105, 0.12);
    }

    .checkpoint-header {
      display: flex;
      height: 34px;
      align-items: center;
      justify-content: space-between;
      padding: 0 11px;
      border-bottom: 1px solid #d9e8ef;
      background: #f7fbfd;
    }

    .checkpoint-header span {
      color: #5f7d8e;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.95px;
    }

    .checkpoint-header strong {
      color: #229ed9;
      font-size: 10px;
      font-weight: 850;
    }

    .checkpoint-window {
      position: relative;
      width: 265px;
      height: 386px;
      overflow: hidden;
      background: #dbeaf1;
    }

    .checkpoint-window img {
      position: absolute;
      top: var(--offset);
      left: 0;
      display: block;
      width: 265px;
      height: auto;
    }

    .footer {
      display: flex;
      height: 94px;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding: 0 17px;
      border: 1px solid rgba(20, 71, 100, 0.12);
      border-radius: 15px;
      background: #173c54;
      box-shadow: 0 10px 24px rgba(19, 59, 83, 0.18);
    }

    .footer-copy {
      max-width: 235px;
      color: #d9edf7;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.35;
    }

    .footer-copy strong {
      color: #ffffff;
    }

    .footer-arrow {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 50%;
      background: #229ed9;
      color: #ffffff;
      font-size: 25px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow"><span class="eyebrow-dot"></span>LONG-SCREENSHOT OCR REFERENCE</div>
      <h1>31,186 px of chat.<br><span>Read end to end.</span></h1>
      <div class="stats">
        <div class="stat"><strong>180</strong><span>messages</span></div>
        <div class="stat"><strong>5</strong><span>days</span></div>
        <div class="stat"><strong>21</strong><span>chunks</span></div>
        <div class="stat"><strong>0</strong><span>lost</span></div>
      </div>
    </header>

    <section class="story" aria-label="Full screenshot and five readable checkpoints">
      <aside class="full-rail">
        <div class="rail-label">FULL IMAGE</div>
        <img class="rail-image" src="telegram-chat-long.png" alt="The complete long screenshot">
      </aside>

      <div class="checkpoints">
        <article class="checkpoint">
          <div class="checkpoint-header"><span>START</span><strong>0%</strong></div>
          <div class="checkpoint-window"><img src="telegram-chat-long.png" style="--offset: 0px" alt="Start of the chat"></div>
        </article>
        <article class="checkpoint">
          <div class="checkpoint-header"><span>CHECKPOINT</span><strong>25%</strong></div>
          <div class="checkpoint-window"><img src="telegram-chat-long.png" style="--offset: -2648px" alt="First quarter of the chat"></div>
        </article>
        <article class="checkpoint">
          <div class="checkpoint-header"><span>CHECKPOINT</span><strong>50%</strong></div>
          <div class="checkpoint-window"><img src="telegram-chat-long.png" style="--offset: -5298px" alt="Middle of the chat"></div>
        </article>
        <article class="checkpoint">
          <div class="checkpoint-header"><span>CHECKPOINT</span><strong>75%</strong></div>
          <div class="checkpoint-window"><img src="telegram-chat-long.png" style="--offset: -7947px" alt="Last quarter of the chat"></div>
        </article>
        <article class="checkpoint">
          <div class="checkpoint-header"><span>FINISH</span><strong>100%</strong></div>
          <div class="checkpoint-window"><img src="telegram-chat-long.png" style="--offset: -10209px" alt="End of the chat"></div>
        </article>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-copy"><strong>Entire screenshot at left.</strong><br>Five readable checkpoints at right.</div>
      <div class="footer-arrow">↓</div>
    </footer>
  </main>
</body>
</html>
