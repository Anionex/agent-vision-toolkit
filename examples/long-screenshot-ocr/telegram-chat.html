<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synthetic Telegram Group Chat - Long Screenshot OCR Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #7f9eae;
      color: #17212b;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 390px;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: #7f9eae;
    }

    body { display: block; }

    .phone {
      width: 390px;
      min-height: 100vh;
      overflow: hidden;
      background: #d9e7ed;
      box-shadow: 0 0 24px rgba(28, 50, 62, 0.32);
    }

    .statusbar {
      height: 24px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      background: #456d8c;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.1px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .signal {
      display: flex;
      align-items: flex-end;
      gap: 1px;
      height: 11px;
    }
    .signal i {
      display: block;
      width: 2px;
      border-radius: 1px;
      background: #fff;
    }
    .signal i:nth-child(1) { height: 3px; }
    .signal i:nth-child(2) { height: 5px; }
    .signal i:nth-child(3) { height: 8px; }
    .signal i:nth-child(4) { height: 11px; }

    .wifi {
      width: 13px;
      height: 10px;
      border: 2px solid #fff;
      border-left-color: transparent;
      border-right-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50% 50% 0 0;
      position: relative;
    }
    .wifi::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
    }

    .battery {
      width: 19px;
      height: 9px;
      padding: 1px;
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 2px;
      position: relative;
    }
    .battery::before {
      content: "";
      display: block;
      width: 13px;
      height: 5px;
      border-radius: 1px;
      background: #fff;
    }
    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      border-radius: 0 1px 1px 0;
      background: rgba(255,255,255,0.9);
    }

    .appbar {
      height: 58px;
      padding: 0 8px 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      background: #517da2;
      box-shadow: 0 2px 5px rgba(39, 66, 82, 0.3);
      position: relative;
      z-index: 5;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: currentColor;
    }
    .icon-button svg { width: 23px; height: 23px; fill: currentColor; }
    .back svg { width: 25px; height: 25px; }

    .chat-avatar {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      border-radius: 50%;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.2), transparent 42%),
        linear-gradient(145deg, #54b9ef, #2788cb);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.35px;
    }

    .chat-heading {
      min-width: 0;
      flex: 1;
    }
    .chat-title {
      overflow: hidden;
      color: #fff;
      font-size: 16px;
      line-height: 20px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-subtitle {
      margin-top: 1px;
      color: rgba(255,255,255,0.76);
      font-size: 12px;
      line-height: 15px;
    }

    .app-actions {
      display: flex;
      align-items: center;
      margin-left: 2px;
    }
    .app-actions .icon-button { width: 32px; }
    .app-actions svg { width: 20px; height: 20px; }

    .pinned {
      height: 48px;
      padding: 6px 10px 6px 12px;
      display: grid;
      grid-template-columns: 3px 1fr 24px;
      gap: 9px;
      align-items: center;
      background: rgba(255,255,255,0.97);
      border-bottom: 1px solid #d4dde2;
      box-shadow: 0 1px 3px rgba(42, 68, 81, 0.12);
      position: relative;
      z-index: 4;
    }
    .pinned-line {
      width: 3px;
      height: 34px;
      border-radius: 3px;
      background: #49a5e6;
    }
    .pinned-copy { min-width: 0; }
    .pinned-title {
      color: #3b91cc;
      font-size: 12px;
      line-height: 15px;
      font-weight: 700;
    }
    .pinned-text {
      overflow: hidden;
      color: #4d5f69;
      font-size: 12px;
      line-height: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pinned-close {
      color: #8fa0aa;
      font-size: 24px;
      font-weight: 300;
      text-align: center;
      transform: translateY(-1px);
    }

    .chat {
      position: relative;
      overflow: hidden;
      background: #d9e7ed;
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .messages {
      position: relative;
      z-index: 1;
      padding: 10px 8px 18px;
    }

    .date-row,
    .service-row,
    .unread-row {
      display: flex;
      justify-content: center;
      clear: both;
    }
    .date-row { margin: 8px 0 10px; }
    .service-row { margin: 7px 0 10px; }
    .unread-row { margin: 12px -8px; }

    .date-pill,
    .service-pill {
      max-width: 310px;
      padding: 5px 10px;
      color: #fff;
      border-radius: 12px;
      background: rgba(83, 113, 129, 0.66);
      box-shadow: 0 1px 1px rgba(37, 61, 73, 0.2);
      backdrop-filter: blur(3px);
      text-align: center;
      text-shadow: 0 1px 1px rgba(40, 62, 72, 0.18);
    }
    .date-pill {
      font-size: 12px;
      line-height: 16px;
      font-weight: 650;
    }
    .service-pill {
      font-size: 11.5px;
      line-height: 16px;
    }

    .unread-line {
      width: 100%;
      height: 28px;
      display: grid;
      place-items: center;
      color: #4c94c4;
      background: rgba(255,255,255,0.94);
      border-top: 1px solid rgba(116,155,177,0.26);
      border-bottom: 1px solid rgba(116,155,177,0.26);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1px;
    }

    .message-row {
      position: relative;
      display: flex;
      width: 100%;
      margin: 2px 0;
    }
    .message-row.in {
      justify-content: flex-start;
      padding-left: 36px;
    }
    .message-row.out { justify-content: flex-end; }
    .message-row.group-start { margin-top: 7px; }
    .message-row.group-end { margin-bottom: 7px; }

    .sender-avatar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(34, 56, 68, 0.24);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .bubble {
      position: relative;
      width: fit-content;
      max-width: 306px;
      min-width: 72px;
      padding: 6px 8px 5px;
      border-radius: 8px;
      box-shadow: 0 1px 1px rgba(38, 61, 72, 0.2);
    }
    .message-row.in .bubble { background: #fff; }
    .message-row.out .bubble { background: #e1ffc7; }
    .message-row.in.group-start .bubble { border-top-left-radius: 8px; }
    .message-row.out.group-start .bubble { border-top-right-radius: 8px; }

    .message-row.in.group-end .bubble::before,
    .message-row.out.group-end .bubble::before {
      content: "";
      position: absolute;
      bottom: 0;
      width: 11px;
      height: 13px;
      filter: drop-shadow(0 1px 0 rgba(38,61,72,0.16));
    }
    .message-row.in.group-end .bubble::before {
      left: -7px;
      background: #fff;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }
    .message-row.out.group-end .bubble::before {
      right: -7px;
      background: #e1ffc7;
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }

    .sender-name {
      margin: 0 0 2px;
      font-size: 12px;
      line-height: 15px;
      font-weight: 750;
    }

    .forwarded {
      margin-bottom: 4px;
      color: #3e96cb;
      font-size: 11.5px;
      line-height: 15px;
      font-weight: 650;
    }

    .reply {
      margin: 0 0 5px;
      padding: 4px 7px 4px 8px;
      border-left: 3px solid #4a9bd0;
      border-radius: 3px;
      background: rgba(80, 157, 207, 0.08);
    }
    .message-row.out .reply {
      border-left-color: #63aa42;
      background: rgba(94, 164, 67, 0.08);
    }
    .reply-sender {
      color: #3d91c4;
      font-size: 11px;
      line-height: 14px;
      font-weight: 750;
    }
    .message-row.out .reply-sender { color: #4c9b3e; }
    .reply-text {
      max-width: 260px;
      overflow: hidden;
      color: #53646e;
      font-size: 11px;
      line-height: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .message-text {
      font-size: 14px;
      line-height: 18px;
      letter-spacing: -0.04px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .code {
      margin-top: 6px;
      padding: 7px 8px;
      color: #304552;
      border-radius: 5px;
      background: rgba(46, 76, 93, 0.08);
      font: 11.5px/16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }

    .file-card,
    .link-card {
      margin-top: 5px;
      display: grid;
      align-items: center;
      gap: 8px;
      border-radius: 6px;
      background: rgba(67, 139, 180, 0.07);
    }
    .file-card {
      grid-template-columns: 38px 1fr;
      padding: 6px;
    }
    .file-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: #fff;
      border-radius: 50%;
      background: #52a9dc;
      font-size: 9px;
      font-weight: 850;
    }
    .file-name,
    .link-title {
      color: #22323c;
      font-size: 12px;
      line-height: 15px;
      font-weight: 700;
    }
    .file-meta,
    .link-description {
      margin-top: 1px;
      color: #71818a;
      font-size: 10.5px;
      line-height: 14px;
    }
    .link-card {
      grid-template-columns: 3px 1fr;
      padding: 5px 7px 6px 0;
    }
    .link-accent {
      width: 3px;
      align-self: stretch;
      border-radius: 3px;
      background: #4a9ed2;
    }

    .photo-card {
      width: 280px;
      height: 145px;
      margin: -2px -4px 5px;
      overflow: hidden;
      position: relative;
      border-radius: 7px;
      background:
        radial-gradient(circle at 73% 25%, #fff3ad 0 14px, transparent 15px),
        linear-gradient(155deg, transparent 0 43%, rgba(19, 80, 104, 0.25) 44% 45%, transparent 46%),
        linear-gradient(25deg, #90d1e7 0 38%, #5aa6c7 39% 58%, #3d7f9f 59% 100%);
    }
    .photo-card::before,
    .photo-card::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 170px;
      height: 75px;
      border-radius: 70% 70% 0 0;
      background: rgba(19, 83, 91, 0.34);
    }
    .photo-card::before { left: -32px; transform: rotate(8deg); }
    .photo-card::after { right: -32px; transform: rotate(-8deg); }
    .photo-label {
      position: absolute;
      left: 10px;
      bottom: 9px;
      z-index: 2;
      padding: 4px 7px;
      color: #fff;
      border-radius: 4px;
      background: rgba(27, 51, 65, 0.56);
      font-size: 11px;
      font-weight: 650;
    }

    .voice-card {
      min-width: 235px;
      margin-top: 2px;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 8px;
      align-items: center;
    }
    .voice-play {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: #fff;
      border-radius: 50%;
      background: #4ea5d7;
      font-size: 14px;
      transform: rotate(-90deg);
    }
    .waveform {
      height: 18px;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .waveform i {
      width: 2px;
      border-radius: 2px;
      background: #73a7c4;
    }
    .voice-meta {
      margin-top: 1px;
      color: #71818a;
      font-size: 10px;
    }

    .poll-card { margin-top: 4px; min-width: 270px; }
    .poll-question {
      font-size: 13px;
      line-height: 17px;
      font-weight: 700;
    }
    .poll-subtitle {
      margin-top: 2px;
      color: #6a7a83;
      font-size: 10.5px;
    }
    .poll-option {
      margin-top: 7px;
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 7px;
      align-items: center;
      font-size: 12px;
      line-height: 15px;
    }
    .poll-radio {
      width: 18px;
      height: 18px;
      border: 2px solid #52a4d4;
      border-radius: 50%;
    }

    .message-meta {
      min-height: 12px;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
      color: #7b8a92;
      font-size: 9.5px;
      line-height: 11px;
      white-space: nowrap;
    }
    .edited { color: #86949b; }
    .checks {
      color: #3fa4dc;
      font-size: 12px;
      line-height: 10px;
      letter-spacing: -4px;
      margin-right: 3px;
    }

    .reaction {
      position: absolute;
      right: 7px;
      bottom: -14px;
      z-index: 3;
      padding: 2px 6px;
      color: #52636d;
      border: 1px solid rgba(111, 135, 148, 0.28);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(39, 63, 75, 0.16);
      font-size: 10px;
      line-height: 14px;
    }
    .message-row:has(.reaction) { margin-bottom: 17px; }

    .composer-wrap {
      min-height: 62px;
      padding: 7px 8px 8px;
      display: grid;
      grid-template-columns: 1fr 46px;
      gap: 6px;
      align-items: end;
      background: #d9e7ed;
      border-top: 1px solid rgba(118, 151, 168, 0.22);
      position: relative;
    }
    .composer {
      height: 48px;
      padding: 0 10px;
      display: grid;
      grid-template-columns: 28px 1fr 28px 28px;
      gap: 5px;
      align-items: center;
      color: #84949d;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(43, 68, 81, 0.14);
    }
    .composer .placeholder { font-size: 14px; }
    .composer-icon {
      display: grid;
      place-items: center;
      color: #84949d;
      font-size: 22px;
      line-height: 1;
    }
    .composer-icon svg { width: 21px; height: 21px; fill: currentColor; }
    .mic {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: #fff;
      border-radius: 50%;
      background: #4ca5d7;
      box-shadow: 0 1px 3px rgba(38, 91, 120, 0.3);
    }
    .mic svg { width: 22px; height: 22px; fill: currentColor; }

    .scroll-button {
      position: absolute;
      right: 12px;
      bottom: 70px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: #76909e;
      border-radius: 50%;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 1px 4px rgba(39, 65, 78, 0.26);
      font-size: 20px;
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Fully synthetic Telegram-style group chat">
    <div class="statusbar" aria-hidden="true">
      <span>10:58</span>
      <div class="status-icons">
        <div class="signal"><i></i><i></i><i></i><i></i></div>
        <div class="wifi"></div>
        <span>92%</span>
        <div class="battery"></div>
      </div>
    </div>

    <header class="appbar">
      <div class="icon-button back" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </div>
      <div class="chat-avatar">AL</div>
      <div class="chat-heading">
        <div class="chat-title">Aurora Launch Room</div>
        <div class="chat-subtitle">12 members, 5 online</div>
      </div>
      <div class="app-actions" aria-hidden="true">
        <div class="icon-button"><svg viewBox="0 0 24 24"><path d="M17 10.5V6c0-1.1-.9-2-2-2H5C3.9 4 3 4.9 3 6v12c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4.5l4 4v-11z"/></svg></div>
        <div class="icon-button"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.7 5.1 6.5 6.5l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4.2c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1z"/></svg></div>
        <div class="icon-button"><svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
      </div>
    </header>

    <div class="pinned">
      <div class="pinned-line"></div>
      <div class="pinned-copy">
        <div class="pinned-title">Pinned Message</div>
        <div class="pinned-text">Launch checklist · owner matrix · rollback steps</div>
      </div>
      <div class="pinned-close" aria-hidden="true">×</div>
    </div>

    <section class="chat">
      <svg class="wallpaper" aria-hidden="true">
        <defs>
          <pattern id="telegram-doodles" width="112" height="112" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="#6f9aae" stroke-width="1.15" opacity="0.12" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 15h18l-9 8zM21 23v8"/>
              <circle cx="79" cy="19" r="8"/><path d="M75 19h8M79 15v8"/>
              <path d="M45 48c7-8 16-8 23 0-7 8-16 8-23 0z"/><circle cx="56.5" cy="48" r="3"/>
              <path d="M15 74l8-8 8 8-8 8zM82 71c8 0 14 5 14 11H68c0-6 6-11 14-11z"/>
              <path d="M45 92h16l-2 8H47zM52 92v-6"/>
              <path d="M98 43l5 3-5 3zM8 103c4-5 9-5 13 0"/>
            </g>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#telegram-doodles)"/>
      </svg>
      <div id="messages" class="messages"></div>
      <div class="scroll-button" aria-hidden="true">⌄</div>
    </section>

    <footer class="composer-wrap">
      <div class="composer">
        <div class="composer-icon" aria-hidden="true">☺</div>
        <div class="placeholder">Message</div>
        <div class="composer-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v11.5a1.5 1.5 0 0 1-3 0V6H9v10.5a3 3 0 0 0 6 0V5a4.5 4.5 0 0 0-9 0v12.5a6 6 0 0 0 12 0V6z"/></svg>
        </div>
        <div class="composer-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.2L15 3zm3 14a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.2a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6z"/></svg>
        </div>
      </div>
      <div class="mic" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5.3-3a5.3 5.3 0 0 1-10.6 0H5a7 7 0 0 0 6 6.9V21H8v2h8v-2h-3v-3.1A7 7 0 0 0 19 11z"/></svg>
      </div>
    </footer>
  </main>

  <script id="fixture-json" type="application/json"></script>
  <script>
    const people = {

      if (item.type === "system") {

      }
      if (item.type === "unread") {
        return `<div class="unread-row"><div class="unread-line">${escapeHtml(item.text)}</div></div>`;
      }

      const previous = items[index - 1];
      const next = items[index + 1];
      const sameAs = other => other && other.type === "message" && other.sender === item.sender && other.side === item.side;
      const groupStart = !sameAs(previous);
      const groupEnd = !sameAs(next);
      const person = people[item.sender] || people["Maya Chen"];
      const avatar = item.side === "in" && groupEnd
        ? `<div class="sender-avatar" style="background:${person.gradient}">${escapeHtml(initials(item.sender))}</div>`

        ? `<div class="sender-name" style="color:${person.color}">${escapeHtml(item.sender)}</div>`
        : "";
      const forwarded = item.forwarded
        ? `<div class="forwarded">Forwarded from ${escapeHtml(item.forwarded)}</div>`
        : "";
      const reply = item.reply ? `

      const photo = item.photo ? `

        </div>` : "";
      const reaction = item.reaction ? `<div class="reaction">${item.reaction}</div>` : "";
      const edited = item.edited ? `<span class="edited">edited</span>` : "";
      const checks = item.side === "out" ? `<span class="checks">✓✓</span>` : "";

      return `
        <div class="message-row ${item.side} ${groupStart ? "group-start" : ""} ${groupEnd ? "group-end" : ""}">
          ${avatar}
          <article class="bubble">
            ${sender}${forwarded}${reply}${photo}${text}${code}${file}${link}${voice}${poll}
            <div class="message-meta">${edited}<span>${escapeHtml(item.time)}</span>${checks}</div>
            ${reaction}
          </article>
        </div>`;
    };

    document.getElementById("messages").innerHTML = items.map(renderMessage).join("");
    document.body.dataset.contentHeight = String(document.documentElement.scrollHeight);
    document.body.dataset.recordCount = String(records.length);
  </script>
</body>
</html>
